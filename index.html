<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shooting game</title>
    <link rel="icon" type="image/png" href="https://zh.minecraft.wiki/images/thumb/Cotan_%28texture%29_JE1_BE1.png/72px-Cotan_%28texture%29_JE1_BE1.png?c5278">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; font-family: 'Microsoft YaHei', '微软雅黑', sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; overscroll-behavior: none; color: #fff; }
        canvas { display: block; touch-action: none; }
        input, textarea { user-select: text !important; -webkit-user-select: text !important; -webkit-touch-callout: default !important; touch-action: auto !important; }

        :root { --hotbar-w: 378px; --hotbar-h: 46px; }
        body.mobile { --hotbar-w: 306px; --hotbar-h: 37px; }

        @keyframes crosshairBreathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.88; }
            50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
        }
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 26px; font-weight: bold; line-height: 1;
            pointer-events: none; z-index: 10;
            text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.6);
            animation: crosshairBreathe 2.4s ease-in-out infinite;
        }
        #crosshair.hidden { display: none; animation: none; }

        #hud { position: fixed; top: 12px; left: 12px; font-size: 13px; z-index: 10; text-shadow: 1px 1px 0 #000; pointer-events: none; line-height: 1.7; background: rgba(0,0,0,0.75); padding: 8px 12px; min-width: 200px; }
        #hud .label { color: #9a9a9a; }
        .hp-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .hp-bar { flex: 1; height: 12px; background: rgba(255,255,255,0.15); position: relative; overflow: hidden; min-width: 120px; }
        .hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); will-change: width; }
        .hp-fill.mid { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .hp-fill.low { background: linear-gradient(90deg, #ef4444, #dc2626); }

        @keyframes hpCriticalPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.6); } }
        .hp-fill.critical { animation: hpCriticalPulse 1s ease-in-out infinite; }
        @keyframes hpHitFlash { 0% { filter: brightness(3.5) saturate(0); } 100% { filter: brightness(1) saturate(1); } }
        .hp-fill.hit-flash { animation: hpHitFlash 0.4s ease-out; }
        @keyframes hpTextBump { 0% { transform: scale(1); color: #fff; } 50% { transform: scale(1.45); color: #ff7777; } 100% { transform: scale(1); color: #fff; } }
        .hp-text { font-size: 12px; color: #fff; min-width: 28px; text-align: right; font-weight: bold; display: inline-block; }
        .hp-text.bump { animation: hpTextBump 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

        #killFeed {
            position: fixed; top: 128px; left: 12px; right: auto;
            z-index: 10; font-size: 13px; color: #fff;
            text-shadow: 1px 1px 0 #000; pointer-events: none;
            text-align: left; max-width: 560px;
        }
        .kill-entry {
            background: rgba(0,0,0,0.75); padding: 4px 10px; margin-bottom: 4px;
            text-align: left; width: 100%; box-sizing: border-box;
            animation: killIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), fadeOut 3s forwards;
        }
        @keyframes killIn { from { transform: translateX(-30px) scale(0.85); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes fadeOut { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

        #chatBar {
            position: fixed; left: 12px; top: 280px; right: auto; bottom: auto;
            width: 420px; max-width: calc(100vw - 24px);
            height: 56vh; max-height: 56vh;
            background: rgba(0,0,0,0.55); z-index: 55;
            padding: 10px 14px; display: flex; flex-direction: column;
            gap: 3px; pointer-events: none; border-radius: 4px; overflow: hidden;
        }
        #chatMessages { display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; overflow: hidden; flex: 1; min-height: 0; }
        .chat-line {
            background: transparent; padding: 3px 6px; color: #fff;
            font-size: 15px; line-height: 1.5;
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
            animation: chatIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            word-break: break-all;
        }
        .chat-line .who { color: #5aff5a; }
        .chat-line .who.self { color: #5aafff; }
        .chat-line .who.msg { color: #ffaa00; }
        .chat-line.private { background: rgba(80,30,80,0.6); }
        @keyframes chatIn { from { transform: translateY(14px) scale(0.92); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        #chatInputWrap { display: none; gap: 6px; pointer-events: auto; padding-top: 4px; flex-shrink: 0; }
        #chatInputWrap.active { display: flex; animation: chatIn 0.25s ease; }
        #chatInput { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 15px; outline: none; font-family: inherit; }
        #chatSend { padding: 8px 16px; background: rgba(255,255,255,0.22); color: #fff; border: none; cursor: pointer; font-family: inherit; font-size: 14px; }

        body.mobile #killFeed { top: 122px; font-size: 12px; max-width: calc(100vw - 24px); }
        body.mobile #chatBar { top: auto; bottom: 10px; left: 10px; width: 320px; height: auto; max-height: 34vh; padding: 5px 8px; }
        body.mobile #chatMessages { max-height: 30vh; }
        body.mobile .chat-line { font-size: 13px; line-height: 1.35; padding: 1px 4px; }
        body.mobile #chatInput { font-size: 14px; padding: 6px 10px; }
        body.mobile #chatSend { font-size: 13px; padding: 6px 14px; }

        #chatBtn { position: fixed; bottom: 92px; left: calc(50% + var(--hotbar-w) / 2 + 8px); padding: 8px 14px; background: rgba(0,0,0,0.75); color: #fff; font-size: 13px; border: none; cursor: pointer; z-index: 100; letter-spacing: 1px; white-space: nowrap; transition: transform 0.15s ease, background 0.15s ease; }
        #chatBtn:hover { transform: scale(1.06); background: rgba(40,40,40,0.9); }
        #chatBtn:active { transform: scale(0.95); }
        #throwBtn { position: fixed; bottom: 92px; right: calc(50% + var(--hotbar-w) / 2 + 8px); padding: 8px 14px; background: rgba(0,0,0,0.75); color: #fff; font-size: 13px; border: none; cursor: pointer; z-index: 100; letter-spacing: 1px; display: none; white-space: nowrap; transition: transform 0.15s ease, background 0.15s ease; }
        #throwBtn:hover { transform: scale(1.06); background: rgba(40,40,40,0.9); }
        #throwBtn:active { transform: scale(0.95); }
        body.mobile #throwBtn { display: block; }
        body.mobile #chatBtn, body.mobile #throwBtn { bottom: 96px; padding: 6px 10px; font-size: 12px; }

        #settingsBtn { position: fixed; top: 12px; right: 12px; width: 42px; height: 42px; background: rgba(0,0,0,0.75); border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s; }
        #settingsBtn:hover { transform: rotate(90deg) scale(1.1); background: rgba(60,60,60,0.9); }
        #settingsPanel { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 200; padding: 80px 24px 40px; opacity: 0; overflow-y: auto; transition: opacity 0.3s ease; }
        #settingsPanel.active { display: flex; opacity: 1; }
        #settingsPanel::-webkit-scrollbar { width: 6px; }
        #settingsPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); }
        #settingsPanel .panel-content { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; padding-bottom: 60px; animation: panelSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes panelSlideIn { from { transform: translateY(40px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        #backBtn { position: fixed; top: 16px; left: 16px; width: 48px; height: 48px; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 201; transition: transform 0.2s; }
        #backBtn:hover { transform: translateX(-4px); }
        #settingsPanel h2 { font-size: 22px; margin-bottom: 28px; color: #fff; letter-spacing: 3px; text-shadow: 2px 2px 0 #000; }
        .setting-row { width: 100%; margin-bottom: 22px; }
        .setting-row label { display: block; font-size: 12px; margin-bottom: 8px; color: #c8c8c8; letter-spacing: 1px; }
        .setting-row input[type="text"] { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.75); border: none; color: #fff; font-size: 15px; outline: none; font-family: inherit; transition: box-shadow 0.2s; }
        .setting-row input[type="text"]:focus { box-shadow: 0 0 0 2px #5aff5a inset; }
        .setting-row input[type="range"] { width: 100%; height: 8px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.25); outline: none; border: none; cursor: pointer; }
        .setting-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; background: #fff; cursor: pointer; transition: transform 0.15s; }
        .setting-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        .range-val { float: right; color: #fff; font-size: 13px; }
        .toggle-group { display: flex; gap: 8px; }
        .toggle-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.08); color: #9a9a9a; border: none; font-size: 13px; cursor: pointer; text-align: center; font-family: inherit; transition: background 0.2s, color 0.2s, transform 0.15s; }
        .toggle-btn:hover { transform: scale(1.03); }
        .toggle-btn:active { transform: scale(0.97); }
        .toggle-btn.active { background: rgba(255,255,255,0.32); color: #fff; }
        .skin-row { display: flex; gap: 12px; align-items: stretch; }
        .skin-preview { width: 72px; height: 72px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .skin-preview img { max-width: 100%; max-height: 100%; image-rendering: pixelated; transition: transform 0.2s; }
        .skin-preview:hover img { transform: scale(1.08); }
        .skin-buttons { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .skin-btn { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.08); color: #ddd; border: none; font-size: 12px; cursor: pointer; font-family: inherit; transition: background 0.15s, transform 0.15s; }
        .skin-btn:hover { background: rgba(255,255,255,0.16); transform: scale(1.02); }
        .skin-btn:active { transform: scale(0.97); }
        .big-btn { width: 100%; padding: 12px; background: rgba(255,255,255,0.12); color: #fff; border: none; font-size: 13px; cursor: pointer; letter-spacing: 1px; font-family: inherit; transition: background 0.2s, transform 0.15s; }
        .big-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.02); }
        .big-btn:active { transform: scale(0.97); }

        #roomModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 300; padding: 24px; }
        #roomModal.active { display: flex; }
        #roomModal .modal-box { width: 100%; max-width: 340px; background: rgba(20,20,20,0.95); padding: 24px; display: flex; flex-direction: column; gap: 14px; animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { transform: scale(0.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #roomModal h3 { font-size: 16px; text-align: center; letter-spacing: 2px; }
        #roomModal input { padding: 12px; background: rgba(255,255,255,0.08); border: none; color: #fff; font-size: 16px; text-align: center; outline: none; font-family: inherit; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions button { flex: 1; padding: 11px; background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; transition: background 0.15s, transform 0.15s; }
        .modal-actions button:hover { background: rgba(255,255,255,0.22); }
        .modal-actions button:active { transform: scale(0.96); }

        #mobileControls { position: fixed; inset: 0; pointer-events: none; z-index: 60; display: none; }
        #mobileControls.active { display: block; }
        #lookZone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; touch-action: none; z-index: 1; }

        #joystickZone { position: fixed; bottom: 34px; left: 34px; width: 136px; height: 136px; border-radius: 50%; background: rgba(0,0,0,0.75); pointer-events: auto; touch-action: none; z-index: 200; display: none; }
        body.mobile #joystickZone { display: block; }
        #joystickKnob { position: absolute; top: 50%; left: 50%; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.35); transform: translate(-50%, -50%); pointer-events: none; will-change: left, top; }

        #sprintBtn, #shootBtn, #jumpBtn, #bagBtn, #aimBtn {
            position: fixed; border-radius: 50%; background: rgba(0,0,0,0.75); color: #fff;
            display: none; align-items: center; justify-content: center;
            pointer-events: auto; touch-action: none; font-family: inherit;
            z-index: 200; user-select: none; -webkit-user-select: none;
            transition: background 0.15s, transform 0.15s;
        }
        body.mobile #sprintBtn, body.mobile #shootBtn, body.mobile #jumpBtn,
        body.mobile #bagBtn, body.mobile #aimBtn { display: flex; }

        #sprintBtn { bottom: 182px; left: 73px; width: 58px; height: 58px; font-size: 11px; color: #bbb; }
        #sprintBtn.active { background: rgba(255,255,255,0.32); color: #fff; }
        #shootBtn { bottom: 44px; right: 34px; width: 84px; height: 84px; font-size: 14px; }
        #shootBtn:active, #shootBtn.hitting { background: rgba(255,60,60,0.55); transform: scale(0.92); }
        #jumpBtn { bottom: 150px; right: 34px; width: 68px; height: 68px; font-size: 13px; }
        #jumpBtn:active { background: rgba(255,255,255,0.32); transform: scale(0.94); }
        #bagBtn { bottom: 232px; right: 34px; width: 68px; height: 68px; font-size: 13px; }
        #bagBtn:active { background: rgba(255,255,255,0.32); transform: scale(0.94); }
        #aimBtn { bottom: 44px; right: 132px; width: 68px; height: 68px; font-size: 13px; }
        #aimBtn.active { background: rgba(90,180,255,0.55); transform: scale(0.94); }

        #sprintHint { position: fixed; bottom: 162px; left: 87px; width: 30px; height: 20px; color: rgba(255,255,255,0.35); font-size: 14px; text-align: center; pointer-events: none; display: none; z-index: 199; animation: hintPulse 1.8s ease-in-out infinite; }
        body.mobile #sprintHint { display: block; }
        @keyframes hintPulse { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 0.75; transform: translateY(-4px); } }

        #mobileRing { position: fixed; left: -9999px; top: -9999px; width: 172px; height: 172px; border-radius: 50%; border: 5px solid #fff; mix-blend-mode: difference; pointer-events: none; display: none; z-index: 55; transform: translate(-50%, -50%); will-change: left, top; }

        #startScreen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; color: #fff; padding: 24px; gap: 14px; transition: opacity 0.55s ease, visibility 0.55s; }
        #startScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #startScreen > * { animation: startFadeIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
        #startScreen > *:nth-child(1) { animation-delay: 0.05s; }
        #startScreen > *:nth-child(2) { animation-delay: 0.15s; }
        #startScreen > *:nth-child(3) { animation-delay: 0.25s; }
        @keyframes startFadeIn { from { transform: translateY(30px) scale(0.94); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        #startScreen input[type="text"] { padding: 14px 18px; background: rgba(255,255,255,0.06); border: none; color: #fff; font-size: 17px; text-align: center; outline: none; width: 280px; font-family: inherit; touch-action: auto; transition: box-shadow 0.2s; }
        #startScreen input[type="text"]:focus { box-shadow: 0 0 0 2px #5aff5a inset; }
        #startBtn { padding: 14px 58px; background: rgba(255,255,255,0.16); border: none; color: #fff; font-size: 17px; cursor: pointer; letter-spacing: 4px; font-family: inherit; touch-action: auto; transition: background 0.2s, transform 0.15s; }
        #startBtn:hover { background: rgba(255,255,255,0.28); transform: scale(1.04); }
        #startBtn:active { transform: scale(0.96); }
        #loadingHint { font-size: 12px; color: #888; letter-spacing: 1px; transition: color 0.3s; text-align: center; max-width: 320px; word-break: break-all; line-height: 1.5; }

        .hit-marker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 30px; font-weight: bold; pointer-events: none; z-index: 11; animation: hitPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes hitPop { 0% { transform: translate(-50%,-50%) scale(0.3) rotate(-25deg); opacity: 0; } 40% { transform: translate(-50%,-50%) scale(1.35) rotate(8deg); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.8) rotate(0deg); opacity: 0; } }
        #netStatus { position: fixed; bottom: 8px; right: 12px; font-size: 11px; color: #888; z-index: 10; pointer-events: none; text-shadow: 1px 1px 0 #000; }
        #damageFlash { position: fixed; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(200,0,0,0.7) 100%); opacity: 0; pointer-events: none; z-index: 15; transition: opacity 0.4s ease-out; }
        #damageFlash.flash { opacity: 1; transition: opacity 0s; }
        #hitTint { position: fixed; inset: 0; background: rgba(200, 20, 20, 0.35); opacity: 0; pointer-events: none; z-index: 14; transition: opacity 0.1s; }
        #hitTint.active { opacity: 1; transition: opacity 0s; }
        #deathFade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 40; transition: opacity 0.6s ease; }
        #deathFade.active { opacity: 1; }

        #hotbar {
            position: fixed; bottom: 92px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: stretch; gap: 0;
            padding: 0; margin: 0; z-index: 90;
            width: var(--hotbar-w); height: var(--hotbar-h);
            background: url('https://zh.minecraft.wiki/images/thumb/Hotbar.png/300px-Hotbar.png?95cb4') no-repeat center center;
            background-size: 100% 100%; image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }
        .hotbar-slot { flex: 1 1 0; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; background: transparent; overflow: visible; }
        .hotbar-slot.active {
            background: url('https://zh.minecraft.wiki/images/Hotbar_selection.png?ba576') no-repeat center center;
            background-size: contain; image-rendering: pixelated;
        }
        @keyframes slotBump { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 70% { transform: scale(0.95); } 100% { transform: scale(1); } }
        .hotbar-slot.bump { animation: slotBump 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hotbar-slot:hover { background-color: rgba(255,255,255,0.08); }
        .hotbar-img { width: 70%; height: 70%; object-fit: contain; image-rendering: pixelated; pointer-events: none; display: block; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hotbar-slot.active .hotbar-img { transform: scale(1.05); }
        .hotbar-count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; font-weight: bold; pointer-events: none; z-index: 2; }

        #itemName { position: fixed; bottom: 148px; left: 50%; color: #fff; font-size: 14px; background: rgba(0,0,0,0.7); padding: 4px 14px; z-index: 89; pointer-events: none; letter-spacing: 1px; white-space: nowrap; opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.9); transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #itemName.visible { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        body.mobile #hotbar { bottom: 96px; }
        body.mobile #itemName { bottom: 144px; font-size: 12px; }

        #bagPanel {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.82);
            opacity: 0; visibility: hidden;
            background: rgba(20,20,20,0.95); padding: 20px; z-index: 400;
            display: flex; flex-direction: column; gap: 14px;
            border: 2px solid #555; max-width: 92vw; max-height: 90vh;
            overflow-y: auto; pointer-events: none;
            transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease, visibility 0.32s;
        }
        #bagPanel.active { transform: translate(-50%, -50%) scale(1); opacity: 1; visibility: visible; pointer-events: auto; }
        #bagPanel h3 { font-size: 16px; text-align: center; letter-spacing: 2px; color: #fff; }
        .bag-grid { display: grid; grid-template-columns: repeat(6, 56px); gap: 6px; }
        .bag-slot { width: 56px; height: 56px; background: rgba(255,255,255,0.08); position: relative; display: flex; align-items: center; justify-content: center; cursor: grab; user-select: none; overflow: hidden; transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.18s ease, box-shadow 0.18s; }
        .bag-slot:hover { transform: scale(1.08) translateY(-2px); background: rgba(255,255,255,0.2); box-shadow: 0 6px 12px rgba(0,0,0,0.4); z-index: 2; }
        .bag-slot.dragover { background: rgba(90,255,90,0.25); box-shadow: 0 0 0 2px #5aff5a inset, 0 0 14px rgba(90,255,90,0.6); transform: scale(1.05); }

/* ==================== 木桶角落轮换 ==================== */
/* 4 个角落（地图 120x120，原点在中心，边界 ±60，留出边距） */
const BARREL_CORNERS = [
    { x: -50, z: -50, dx:  1 },  // 左上：向右偏移
    { x:  50, z: -50, dx: -1 },  // 右上：向左偏移

function isBarrelSpotFree(x, z) {
    if (Math.abs(x) > 56 || Math.abs(z) > 56) return false;
    for (const bp of buildingPositions) {
        if (Math.abs(x - bp.x) < 8 && Math.abs(z - bp.z) < 8) return false;
    }
    for (const c of colliders) {
        const dx = x - c.x, dz = z - c.z;
        const r = c.radius + 0.8;
        if (dx * dx + dz * dz < r * r) return false;
    }
    for (const b of barrels) {
        const dx = x - b.position.x, dz = z - b.position.z;
        if (dx * dx + dz * dz < 9) return false;
    }
    const pdx = x - player.pos.x, pdz = z - player.pos.z;
    if (pdx * pdx + pdz * pdz < 36) return false;
    return true;
}

/* 从指定角落开始，朝地图中心偏移找空位；返回 { x, z, cornerIndex } 或 null */
function findBarrelSpotFromCorner(cornerIdx) {
    const total = BARREL_CORNERS.length;
    for (let attempt = 0; attempt < total; attempt++) {
        const idx = (cornerIdx + attempt) % total;
        const corner = BARREL_CORNERS[idx];
        for (let step = 0; step < 34; step++) {
            const offset = step * 3 * corner.dx;
            const x = corner.x + offset;
            const z = corner.z;
            if (Math.abs(x) > 56) break;
            if (isBarrelSpotFree(x, z)) {
                return { x: x, z: z, cornerIndex: idx };
            }
        }
    }
    return null;
}

    return result || '0';

function hashString(str) {
    let h = 2166136261 >>> 0;

}
function makeSeededRandom(seed) {
    let a = seed >>> 0;

        a |= 0;

        let t = a;
        t = Math.imul(t ^ (t >>> 15), 1 | t);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function applyColorSpace(tex) {

function removeBackgroundFromImage(img) {
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    if (!w || !h) return img;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    let imageData;
    try { imageData = ctx.getImageData(0, 0, w, h); } catch (e) { return img; }
    const data = imageData.data;
    const samples = [];
    const pts = [[0,0],[w-1,0],[0,h-1],[w-1,h-1],[Math.floor(w/2),0],[0,Math.floor(h/2)],[w-1,Math.floor(h/2)],[Math.floor(w/2),h-1]];
    for (const [sx, sy] of pts) {
        const idx = (sy * w + sx) * 4;
        samples.push({ r: data[idx], g: data[idx+1], b: data[idx+2], a: data[idx+3] });
    }
    function isBg(r, g, b, a) {
        if (a < 20) return true;
        if (r > 235 && g > 235 && b > 235) return true;
        for (const c of samples) {
            if (c.a < 20) continue;
            const dr = Math.abs(r - c.r), dg = Math.abs(g - c.g), db = Math.abs(b - c.b);
            if (dr < 30 && dg < 30 && db < 30) return true;
        }
        return false;
    }
    const visited = new Uint8Array(w * h);
    const queue = [];
    for (let x = 0; x < w; x++) { queue.push(x); queue.push((h-1) * w + x); }
    for (let y = 0; y < h; y++) { queue.push(y * w); queue.push(y * w + w - 1); }
    let head = 0;
    while (head < queue.length) {
        const pos = queue[head++];
        if (visited[pos]) continue;
        visited[pos] = 1;
        const p = pos * 4;
        if (isBg(data[p], data[p+1], data[p+2], data[p+3])) {
            data[p+3] = 0;
            const x = pos % w, y = Math.floor(pos / w);
            if (x > 0 && !visited[pos-1]) queue.push(pos-1);
            if (x < w-1 && !visited[pos+1]) queue.push(pos+1);
            if (y > 0 && !visited[pos-w]) queue.push(pos-w);
            if (y < h-1 && !visited[pos+w]) queue.push(pos+w);
        }
    }
    ctx.putImageData(imageData, 0, 0);
    return canvas;
}

function createMedkitIcon() {

    return canvas.toDataURL('image/png');
}

function getTexture(url) {
    if (texPromises[url]) return texPromises[url];
    texPromises[url] = new Promise((resolve) => {

            undefined, () => resolve(null)

    return texPromises[url];
}

function getSkinTexture(dataURL) {
    if (!dataURL) return getTexture(ASSETS.kai);
    if (skinTextureCache[dataURL]) return Promise.resolve(skinTextureCache[dataURL]);
    return new Promise((resolve) => {
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');
        loader.load(dataURL,
            (tex) => { try { tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; applyColorSpace(tex); tex.needsUpdate = true; skinTextureCache[dataURL] = tex; resolve(tex); } catch (e) { resolve(getTexture(ASSETS.kai)); } },
            undefined, () => resolve(getTexture(ASSETS.kai))
        );
    });
}

function getItemTexture(itemId) {
    if (itemTextureCache[itemId]) return itemTextureCache[itemId];
    const def = ITEM_DEFS[itemId];
    if (!def) return null;
    const url = itemId === 'medkit' ? medkitDataURL : def.img;
    if (!url) return null;
    const placeholder = new THREE.Texture();
    itemTextureCache[itemId] = placeholder;
    const needRemoveBg = !!def.removeBg;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
        try {
            let sourceCanvas;
            if (needRemoveBg) sourceCanvas = removeBackgroundFromImage(img);
            else {
                sourceCanvas = document.createElement('canvas');
                sourceCanvas.width = img.naturalWidth || img.width;
                sourceCanvas.height = img.naturalHeight || img.height;
                sourceCanvas.getContext('2d').drawImage(img, 0, 0);
            }
            const tex = new THREE.CanvasTexture(sourceCanvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            applyColorSpace(tex);
            tex.needsUpdate = true;
            itemTextureCache[itemId] = tex;
            if (needRemoveBg && !itemIconURL[itemId]) {
                try {
                    itemIconURL[itemId] = sourceCanvas.toDataURL('image/png');
                    renderHotbar();
                    if (bagOpen) renderBag();
                } catch (e) {}
            }
        } catch (e) {}
    };
    img.src = url;
    return placeholder;
}

function getItemImgURL(itemId) {
    if (itemIconURL[itemId]) return itemIconURL[itemId];
    const def = ITEM_DEFS[itemId];
    if (!def) return '';
    if (itemId === 'medkit') return medkitDataURL || '';
    return def.img || '';
}

function aspectOf(tex) {
    if (!tex || !tex.image) return 1;
    const w = tex.image.width, h = tex.image.height;
    if (!w || !h || !isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) return 1;
    return w / h;
}

function createYBillboard(texture, width, height, fallbackColor, opts) {
    opts = opts || {};
    const w = (typeof width === 'number' && isFinite(width) && width > 0.001) ? width : 1;
    const h = (typeof height === 'number' && isFinite(height) && height > 0.001) ? height : 1;
    const geo = new THREE.PlaneGeometry(w, h);
    const mat = new THREE.MeshBasicMaterial({
        map: texture || null,
        color: texture ? 0xffffff : (fallbackColor || 0x888888),
        transparent: true, depthTest: opts.depthTest !== false, depthWrite: false,
        side: THREE.DoubleSide, alphaTest: 0.1,
    });
    const mesh = new THREE.Mesh(geo, mat);
    if (opts.renderOrder !== undefined) mesh.renderOrder = opts.renderOrder;
    yBillboards.push(mesh);
    return mesh;
}

function createFullBillboard(texture, width, height, fallbackColor) {
    const w = (typeof width === 'number' && isFinite(width) && width > 0.001) ? width : 1;
    const h = (typeof height === 'number' && isFinite(height) && height > 0.001) ? height : 1;
    const geo = new THREE.PlaneGeometry(w, h);
    const mat = new THREE.MeshBasicMaterial({
        map: texture || null,
        color: texture ? 0xffffff : (fallbackColor || 0x888888),
        transparent: true, depthTest: true, depthWrite: false,
        side: THREE.DoubleSide, alphaTest: 0.1,
    });
    const mesh = new THREE.Mesh(geo, mat);
    fullBillboards.push(mesh);
    return mesh;
}

function updateYBillboards() {
    if (!camera) return;
    for (const obj of yBillboards) {
        if (!obj.parent) continue;
        obj.getWorldPosition(_tmpVec1);
        const dx = camera.position.x - _tmpVec1.x;
        const dz = camera.position.z - _tmpVec1.z;
        obj.rotation.y = Math.atan2(dx, dz);
    }
}

function updateFullBillboards() {
    if (!camera) return;
    for (const obj of fullBillboards) {
        if (!obj.parent) continue;
        obj.lookAt(camera.position);
    }
}

function removeFromYBillboards(mesh) {
    const idx = yBillboards.indexOf(mesh);
    if (idx >= 0) yBillboards.splice(idx, 1);
}
function removeFromFullBillboards(mesh) {
    const idx = fullBillboards.indexOf(mesh);
    if (idx >= 0) fullBillboards.splice(idx, 1);
}

/* ==================== 陀螺仪 ==================== */
function handleGyroEvent(e) {
    if (!gyroEnabled || !camera || !gameStarted || deathState.active) return;
    if (e.alpha === null || e.beta === null || e.gamma === null) return;
    if (gyroBaseAlpha === null) {
        gyroBaseAlpha = e.alpha;
        gyroBaseBeta = e.beta;
        gyroBaseGamma = e.gamma;
        return;
    }
    let dAlpha = e.alpha - gyroBaseAlpha;
    while (dAlpha > 180) dAlpha -= 360;
    while (dAlpha < -180) dAlpha += 360;
    const dBeta = e.beta - gyroBaseBeta;
    const dGamma = e.gamma - gyroBaseGamma;

    const euler = new THREE.Euler(
        THREE.MathUtils.degToRad(dBeta),
        THREE.MathUtils.degToRad(-dAlpha),
        THREE.MathUtils.degToRad(-dGamma * 0.6),
        'YXZ'
    );
    camera.quaternion.setFromEuler(euler);
}

function setGyroEnabled(on) {
    gyroEnabled = on;
    document.querySelectorAll('.toggle-btn[data-gyro]').forEach(b => {
        b.classList.toggle('active', b.dataset.gyro === (on ? 'on' : 'off'));
    });
    if (on) {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(perm => {
                if (perm === 'granted') {
                    gyroBaseAlpha = gyroBaseBeta = gyroBaseGamma = null;
                    window.addEventListener('deviceorientation', handleGyroEvent);
                } else {
                    gyroEnabled = false;
                    document.querySelectorAll('.toggle-btn[data-gyro]').forEach(b => {
                        b.classList.toggle('active', b.dataset.gyro === 'off');
                    });
                }
            }).catch(() => {
                gyroEnabled = false;
                document.querySelectorAll('.toggle-btn[data-gyro]').forEach(b => {
                    b.classList.toggle('active', b.dataset.gyro === 'off');
                });
            });
        } else {
            gyroBaseAlpha = gyroBaseBeta = gyroBaseGamma = null;
            window.addEventListener('deviceorientation', handleGyroEvent);
        }
    } else {
        window.removeEventListener('deviceorientation', handleGyroEvent);
    }
    try { localStorage.setItem(LS.gyro, on ? 'on' : 'off'); } catch (e) {}
}

const UI_EDITABLE = ['hud', 'hotbar', 'chatBar', 'chatBtn', 'throwBtn', 'settingsBtn', 'itemName', 'killFeed', 'netStatus'];
let uiEditing = false, uiDragState = null;
const uiLayout = {};

function loadUILayout() { try { const s = JSON.parse(localStorage.getItem(LS.uiLayout) || '{}'); for (const k in s) uiLayout[k] = s[k]; } catch (e) {} }
function saveUILayout() { try { localStorage.setItem(LS.uiLayout, JSON.stringify(uiLayout)); } catch (e) {} }
function applyUILayout() {
    for (const id of UI_EDITABLE) {
        const layout = uiLayout[id]; if (!layout) continue;
        const el = document.getElementById(id); if (!el) continue;
        el.style.position = 'fixed'; el.style.left = layout.left + 'px'; el.style.top = layout.top + 'px';

function enterUIEdit() {
    if (uiEditing) return;
    uiEditing = true;
    document.body.classList.add('ui-editing');
    document.getElementById('uiEditBar').classList.add('active');
    if (controls && controls.isLocked) controls.unlock();
    closeChat();
    for (const id of UI_EDITABLE) {
        const el = document.getElementById(id); if (!el) continue;
        const rect = el.getBoundingClientRect();
        if (!uiLayout[id]) uiLayout[id] = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
        el.style.position = 'fixed';
        el.style.left = uiLayout[id].left + 'px'; el.style.top = uiLayout[id].top + 'px';
        el.style.width = uiLayout[id].width + 'px'; el.style.height = uiLayout[id].height + 'px';
        el.style.right = 'auto'; el.style.bottom = 'auto'; el.style.transform = 'none';
        el.classList.add('ui-edit');
        let h = el.querySelector('.ui-resize-handle');
        if (!h) { h = document.createElement('div'); h.className = 'ui-resize-handle'; el.appendChild(h); }
    }
}
function exitUIEdit() {
    if (!uiEditing) return;
    uiEditing = false;
    document.body.classList.remove('ui-editing');
    document.getElementById('uiEditBar').classList.remove('active');
    saveUILayout();
    for (const id of UI_EDITABLE) {
        const el = document.getElementById(id); if (!el) continue;
        el.classList.remove('ui-edit');
        const h = el.querySelector('.ui-resize-handle'); if (h) h.remove();
    }
}
function initUIEditor() {
    loadUILayout(); applyUILayout();
    for (const id of UI_EDITABLE) {
        const el = document.getElementById(id); if (!el) continue;
        el.addEventListener('pointerdown', (e) => {
            if (!uiEditing) return;
            if (e.target.classList && e.target.classList.contains('ui-resize-handle')) return;
            e.preventDefault(); e.stopPropagation();
            const r = el.getBoundingClientRect();
            uiDragState = { mode: 'move', el, id, startX: e.clientX, startY: e.clientY, startLeft: r.left, startTop: r.top };
        }, true);
        el.addEventListener('pointerdown', (e) => {
            if (!uiEditing) return;
            if (!e.target.classList || !e.target.classList.contains('ui-resize-handle')) return;
            e.preventDefault(); e.stopPropagation();
            const r = el.getBoundingClientRect();
            uiDragState = { mode: 'resize', el, id, startX: e.clientX, startY: e.clientY, startWidth: r.width, startHeight: r.height };
        }, true);
        el.addEventListener('dblclick', (e) => {
            if (uiEditing || !gameStarted) return;
            e.preventDefault(); e.stopPropagation();
            enterUIEdit();
        });
    }
    document.addEventListener('pointermove', (e) => {
        if (!uiDragState) return;
        e.preventDefault();
        const dx = e.clientX - uiDragState.startX, dy = e.clientY - uiDragState.startY;
        if (uiDragState.mode === 'move') {
            const nl = uiDragState.startLeft + dx, nt = uiDragState.startTop + dy;
            uiDragState.el.style.left = nl + 'px'; uiDragState.el.style.top = nt + 'px';
            if (!uiLayout[uiDragState.id]) uiLayout[uiDragState.id] = {};
            uiLayout[uiDragState.id].left = nl; uiLayout[uiDragState.id].top = nt;
            if (!uiLayout[uiDragState.id].width) {
                uiLayout[uiDragState.id].width = uiDragState.el.getBoundingClientRect().width;
                uiLayout[uiDragState.id].height = uiDragState.el.getBoundingClientRect().height;
            }
        } else {
            const nw = Math.max(20, uiDragState.startWidth + dx);
            const nh = Math.max(20, uiDragState.startHeight + dy);
            uiDragState.el.style.width = nw + 'px'; uiDragState.el.style.height = nh + 'px';
            if (!uiLayout[uiDragState.id]) uiLayout[uiDragState.id] = {};
            uiLayout[uiDragState.id].width = nw; uiLayout[uiDragState.id].height = nh;
        }
    });
    document.addEventListener('pointerup', () => { if (uiDragState) { saveUILayout(); uiDragState = null; } });
    document.addEventListener('click', (e) => {
        if (uiEditing && !e.target.closest('#uiEditBar')) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    const doneBtn = document.getElementById('uiDoneBtn');
    const resetBtn = document.getElementById('uiResetBtn');
    if (doneBtn) doneBtn.addEventListener('click', (e) => { e.stopPropagation(); exitUIEdit(); });
    if (resetBtn) resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        for (const k in uiLayout) delete uiLayout[k];
        saveUILayout();
        for (const id of UI_EDITABLE) {
            const el = document.getElementById(id); if (!el) continue;
            el.style.left = ''; el.style.top = ''; el.style.width = ''; el.style.height = '';
            el.style.right = ''; el.style.bottom = ''; el.style.transform = ''; el.style.position = '';
            el.classList.remove('ui-edit');
            const h = el.querySelector('.ui-resize-handle'); if (h) h.remove();
        }
        uiEditing = false;
        document.body.classList.remove('ui-editing');
        document.getElementById('uiEditBar').classList.remove('active');
        enterUIEdit();
    });
}
