<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shooting game</title>
    <link rel="icon" type="image/png" href="https://zh.minecraft.wiki/images/thumb/Cotan_%28texture%29_JE1_BE1.png/72px-Cotan_%28texture%29_JE1_BE1.png?c5278">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            overscroll-behavior: none;
            color: #fff;
        }

        canvas { display: block; touch-action: none; }

        /* ===== 准星 ===== */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            line-height: 1;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.6);
            transition: transform 0.15s ease-out, opacity 0.2s;
        }
        #crosshair.recoil { transform: translate(-50%, -50%) scale(1.4); }
        #crosshair.hidden { display: none; }

        /* ===== HUD ===== */
        #hud {
            position: fixed;
            top: 12px;
            left: 12px;
            font-size: 13px;
            z-index: 10;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
            line-height: 1.7;
            background: rgba(0,0,0,0.75);
            padding: 8px 12px;
            min-width: 200px;
            animation: hudIn 0.6s ease 0.3s backwards;
        }
        @keyframes hudIn {
            from { transform: translateX(-20px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }
        #hud .label { color: #9a9a9a; }
        .hud-val { display: inline-block; transition: transform 0.15s; }
        .hud-val.flash { transform: scale(1.3); color: #5aff5a; }

        /* 血量条 */
        .hp-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .hp-bar {
            flex: 1;
            height: 12px;
            background: rgba(255,255,255,0.15);
            position: relative;
            overflow: hidden;
            min-width: 120px;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.25s ease-out, background 0.3s;
        }
        .hp-fill.mid { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .hp-fill.low { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .hp-text {
            font-size: 12px;
            color: #fff;
            min-width: 28px;
            text-align: right;
            font-weight: bold;
        }

        /* ===== 设置按钮 ===== */
        #settingsBtn {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 42px;
            height: 42px;
            background: rgba(0,0,0,0.75);
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: hudIn 0.6s ease 0.4s backwards;
        }

        /* ===== 设置面板 ===== */
        #settingsPanel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 200;
            padding: 80px 24px 40px;
            opacity: 0;
            overflow-y: auto;
            transition: opacity 0.3s ease;
        }
        #settingsPanel.active { display: flex; opacity: 1; }
        #settingsPanel::-webkit-scrollbar { width: 6px; }
        #settingsPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); }
        #settingsPanel::-webkit-scrollbar-track { background: transparent; }

        #settingsPanel .panel-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            animation: panelIn 0.35s ease;
            padding-bottom: 60px;
        }
        @keyframes panelIn {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        #backBtn {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.2s;
            z-index: 201;
        }
        #backBtn:hover { background: rgba(255,255,255,0.18); transform: translateX(-3px); }
        #backBtn:active { transform: translateX(-3px) scale(0.9); }

        #settingsPanel h2 {
            font-size: 22px;
            margin-bottom: 28px;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #000;
        }

        .setting-row {
            width: 100%;
            margin-bottom: 22px;
            animation: fadeUp 0.4s ease backwards;
        }
        @keyframes fadeUp {
            from { transform: translateY(12px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .setting-row label {
            display: block;
            font-size: 12px;
            margin-bottom: 8px;
            color: #c8c8c8;
            letter-spacing: 1px;
        }

        .setting-row input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0,0,0,0.75);
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: background 0.2s;
            font-family: inherit;
        }
        .setting-row input[type="text"]:focus { background: rgba(30,30,30,0.9); }

        .setting-row input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.25);
            outline: none;
            border: none;
            cursor: pointer;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.12s;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .setting-row input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: #ffffff;
            border: none;
            cursor: pointer;
        }
        .range-val { float: right; color: #fff; font-size: 13px; }

        .toggle-group { display: flex; gap: 8px; }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.08);
            color: #9a9a9a;
            border: none;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s, color 0.15s, transform 0.12s;
            font-family: inherit;
        }
        .toggle-btn:hover { background: rgba(255,255,255,0.15); }
        .toggle-btn:active { transform: scale(0.94); }
        .toggle-btn.active {
            background: rgba(255,255,255,0.32);
            color: #ffffff;
        }

        /* 皮肤 */
        .skin-row { display: flex; gap: 12px; align-items: stretch; }
        .skin-preview {
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .skin-preview img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .skin-buttons { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .skin-btn {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255,255,255,0.08);
            color: #ddd;
            border: none;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.15s, color 0.15s;
            font-family: inherit;
        }
        .skin-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
        .skin-btn:active { background: rgba(255,255,255,0.28); }

        /* 大按钮 */
        .big-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: none;
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.15s, transform 0.12s;
            font-family: inherit;
        }
        .big-btn:hover { background: rgba(255,255,255,0.22); }
        .big-btn:active { transform: scale(0.97); }

        /* ===== 房间弹窗 ===== */
        #roomModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 24px;
        }
        #roomModal.active { display: flex; }
        #roomModal .modal-box {
            width: 100%;
            max-width: 340px;
            background: rgba(20,20,20,0.95);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #roomModal h3 {
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        #roomModal input {
            padding: 12px;
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            font-family: inherit;
        }
        #roomModal input:focus { background: rgba(255,255,255,0.14); }
        .room-history-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
        }
        .room-history {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .room-chip {
            padding: 6px 12px;
            background: rgba(255,255,255,0.08);
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .room-chip:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .modal-actions {
            display: flex;
            gap: 8px;
        }
        .modal-actions button {
            flex: 1;
            padding: 11px;
            background: rgba(255,255,255,0.12);
            border: none;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .modal-actions button:hover { background: rgba(255,255,255,0.22); }
        .modal-actions button:active { transform: scale(0.97); }

        /* ===== 移动端 ===== */
        #mobileControls {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            display: none;
        }
        #mobileControls.active { display: block; }

        #joystickZone {
            position: absolute;
            bottom: 34px;
            left: 34px;
            width: 136px;
            height: 136px;
            border-radius: 50%;
            background: rgba(0,0,0,0.75);
            pointer-events: auto;
            touch-action: none;
        }
        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transform: translate(-50%, -50%);
            pointer-events: none;
            will-change: left, top;
        }

        #sprintBtn {
            position: absolute;
            bottom: 182px;
            left: 74px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(0,0,0,0.75);
            color: #bbb;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            transition: background 0.15s, color 0.15s, transform 0.12s, box-shadow 0.15s;
            letter-spacing: 1px;
            font-family: inherit;
        }
        #sprintBtn.active {
            background: rgba(255,255,255,0.32);
            color: #fff;
            transform: scale(1.08);
            box-shadow: 0 0 18px rgba(255,255,255,0.5);
        }

        #sprintHint {
            position: absolute;
            bottom: 158px;
            left: 88px;
            width: 30px;
            height: 20px;
            color: rgba(255,255,255,0.35);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            animation: hintPulse 1.8s ease-in-out infinite;
        }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50%      { opacity: 0.75; transform: translateY(-4px); }
        }

        #shootBtn {
            position: absolute;
            bottom: 44px;
            right: 44px;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 14px;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s, transform 0.12s;
            font-family: inherit;
        }
        #shootBtn.hitting {
            background: rgba(255,60,60,0.55);
            transform: scale(0.92);
        }

        #lookZone {
            position: absolute;
            top: 0;
            right: 0;
            width: 65%;
            height: 72%;
            pointer-events: auto;
            touch-action: none;
        }

        #mobileRing {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 172px;
            height: 172px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            mix-blend-mode: difference;
            pointer-events: none;
            display: none;
            z-index: 55;
            transform: translate(-50%, -50%);
            will-change: left, top;
        }

        /* ===== 开始界面 ===== */
        #startScreen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            color: #fff;
            padding: 24px;
            gap: 14px;
            transition: opacity 0.55s ease, visibility 0.55s;
        }
        #startScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #startScreen input[type="text"] {
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: none;
            color: #fff;
            font-size: 17px;
            text-align: center;
            outline: none;
            width: 280px;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.2s;
            font-family: inherit;
        }
        #startScreen input[type="text"]:focus {
            background: rgba(255,255,255,0.13);
            transform: scale(1.03);
        }
        #startScreen input[type="text"]::placeholder { color: #666; }

        #startRoomHistory {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 280px;
            justify-content: center;
            min-height: 0;
        }
        #startRoomHistory:empty { display: none; }

        #startBtn {
            padding: 14px 58px;
            background: rgba(255,255,255,0.16);
            border: none;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: background 0.2s, transform 0.15s;
            font-family: inherit;
        }
        #startBtn:hover { background: rgba(255,255,255,0.3); }
        #startBtn:active { transform: scale(0.95); }

        /* ===== 提示 ===== */
        #killFeed {
            position: fixed;
            top: 64px;
            right: 12px;
            z-index: 10;
            font-size: 12px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
            text-align: right;
            max-width: 260px;
        }
        .kill-entry {
            background: rgba(0,0,0,0.75);
            padding: 4px 10px;
            margin-bottom: 4px;
            animation: killIn 0.3s ease, fadeOut 3s forwards;
        }
        @keyframes killIn {
            from { transform: translateX(30px); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
        @keyframes fadeOut {
            0%, 70% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(12px); }
        }

        .hit-marker {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 30px;
            font-weight: bold;
            pointer-events: none;
            z-index: 11;
            animation: hitPop 0.35s forwards;
        }
        @keyframes hitPop {
            0%   { transform: translate(-50%,-50%) scale(0.3) rotate(-20deg); opacity: 0; }
            40%  { transform: translate(-50%,-50%) scale(1.3) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%,-50%) scale(1.7) rotate(0deg); opacity: 0; }
        }

        #netStatus {
            position: fixed;
            bottom: 12px;
            left: 12px;
            font-size: 11px;
            color: #888;
            z-index: 10;
            pointer-events: none;
            background: rgba(0,0,0,0.75);
            padding: 4px 8px;
            transition: color 0.3s, opacity 0.3s;
        }
        #netStatus.pulse { animation: netPulse 0.5s ease; }
        @keyframes netPulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.08); color: #5aff5a; }
            100% { transform: scale(1); }
        }

        /* 受伤红闪 */
        #damageFlash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(200,0,0,0.7) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.4s ease-out;
        }
        #damageFlash.flash { opacity: 1; transition: opacity 0s; }

        /* 自由视角提示 */
        #freeCamHint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 60px);
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 12;
            display: none;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
        }
        #freeCamHint.active { display: block; }
    </style>
</head>
<body>

<!-- 开始界面 -->
<div id="startScreen">
    <input type="text" id="roomInput" value="public-room-1" placeholder="房间号" maxlength="32">
    <div id="startRoomHistory"></div>
    <button id="startBtn">确定</button>
</div>

<!-- 游戏内 UI -->
<div id="crosshair">+</div>

<div id="hud">
    <div><span class="label">位置</span> <span class="hud-val" id="posDisplay">0, 0, 0</span></div>
    <div><span class="label">房间</span> <span class="hud-val" id="roomDisplay">-</span></div>
    <div><span class="label">在线</span> <span class="hud-val" id="playerCountDisplay">1</span></div>
    <div class="hp-row">
        <span class="label">血量</span>
        <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
        <span class="hp-text" id="hpText">100</span>
    </div>
</div>

<div id="killFeed"></div>
<div id="netStatus">未连接</div>
<div id="settingsBtn">⚙</div>
<div id="damageFlash"></div>
<div id="freeCamHint">自由视角 · WASD移动 · 空格上升 · Shift下降</div>

<!-- 设置面板 -->
<div id="settingsPanel">
    <button id="backBtn">←</button>
    <div class="panel-content">
        <h2>设 置</h2>

        <div class="setting-row">
            <label>玩家名字（自动保存）</label>
            <input type="text" id="settingsNameInput" maxlength="16" placeholder="Steve">
        </div>

        <div class="setting-row">
            <label>皮肤（自动保存 · 上传2D贴图）</label>
            <div class="skin-row">
                <div class="skin-preview"><img id="skinPreviewImg" alt=""></div>
                <div class="skin-buttons">
                    <button class="skin-btn" id="skinUploadBtn">上传贴图</button>
                    <button class="skin-btn" id="skinResetBtn">默认皮肤</button>
                </div>
            </div>
            <input type="file" id="skinFile" accept="image/*" hidden>
        </div>

        <div class="setting-row">
            <label>操作方式</label>
            <div class="toggle-group">
                <div class="toggle-btn active" data-mode="desktop">键鼠</div>
                <div class="toggle-btn" data-mode="mobile">触屏</div>
            </div>
        </div>

        <div class="setting-row">
            <label>摄像机灵敏度 <span class="range-val" id="sensValue">5.0</span></label>
            <input type="range" id="sensSlider" min="1" max="20" step="1" value="5">
        </div>

        <div class="setting-row">
            <label>视场角 FOV <span class="range-val" id="fovValue">75°</span></label>
            <input type="range" id="fovSlider" min="50" max="110" step="1" value="75">
        </div>

        <div class="setting-row">
            <label>反色光圈大小 <span class="range-val" id="ringValue">172</span></label>
            <input type="range" id="ringSlider" min="60" max="320" step="4" value="172">
        </div>

        <div class="setting-row">
            <label>自由视角</label>
            <div class="toggle-group">
                <div class="toggle-btn active" data-freecam="off">关闭</div>
                <div class="toggle-btn" data-freecam="on">开启</div>
            </div>
        </div>

        <div class="setting-row">
            <label>切换房间</label>
            <button class="big-btn" id="switchRoomBtn">切换到其他房间…</button>
        </div>
    </div>
</div>

<!-- 房间切换弹窗 -->
<div id="roomModal">
    <div class="modal-box">
        <h3>切 换 房 间</h3>
        <input type="text" id="roomModalInput" placeholder="输入房间号" maxlength="32">
        <div class="room-history-title">历史房间</div>
        <div class="room-history" id="roomModalHistory"></div>
        <div class="modal-actions">

/* ============================================================
   纹理
   ============================================================ */
function getTexture(url) {
    if (texPromises[url]) return texPromises[url];
    texPromises[url] = new Promise((resolve) => {
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');
        loader.load(url,
            (tex) => {
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                tex.colorSpace = THREE.SRGBColorSpace;
                texCache[url] = tex;
                resolve(tex);
            },
            undefined,
            () => { console.warn('纹理加载失败:', url); resolve(null); }
        );
    });
    return texPromises[url];
}

function getSkinTexture(dataURL) {
    if (!dataURL) return getTexture(ASSETS.kai);
    if (skinTextureCache[dataURL]) return Promise.resolve(skinTextureCache[dataURL]);
    return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
            const tex = new THREE.Texture(img);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            skinTextureCache[dataURL] = tex;
            resolve(tex);
        };
        img.onerror = () => resolve(getTexture(ASSETS.kai));
        img.src = dataURL;
    });
}

function aspectOf(tex) {
    if (!tex || !tex.image) return 1;
    const w = tex.image.width || 1;
    const h = tex.image.height || 1;
    return w / h;
}

/* ============================================================
   场景
   ============================================================ */
async function buildWorld() {
    const [mossTex, stoneTex, treeTex, kaiTex] = await Promise.all([
        getTexture(ASSETS.mossBlock),
        getTexture(ASSETS.stone),
        getTexture(ASSETS.tree),
        getTexture(ASSETS.kai),
    ]);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fc4e8);
    scene.fog = new THREE.Fog(0x8fc4e8, 36, 88);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(60, 110, 40);
    scene.add(dir);

    const floorGeo = new THREE.PlaneGeometry(CONFIG.floorSize, CONFIG.floorSize);
    const floorMat = new THREE.MeshLambertMaterial({ side: THREE.DoubleSide });
    if (mossTex) {
        mossTex.wrapS = mossTex.wrapT = THREE.RepeatWrapping;
        mossTex.repeat.set(CONFIG.floorRepeat, CONFIG.floorRepeat);
        floorMat.map = mossTex;
    } else {
        floorMat.color = 0x4a7a3a;
    }
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    /* 石头：多种尺寸，比例与贴图一致 */
    const stoneAspect = stoneTex ? aspectOf(stoneTex) : 1;
    const stoneSizes = [
        ...Array.from({ length: 6 }, () => 0.35 + Math.random() * 0.25),
        ...Array.from({ length: 8 }, () => 0.60 + Math.random() * 0.40),
        ...Array.from({ length: 7 }, () => 1.00 + Math.random() * 0.55),
        ...Array.from({ length: 6 }, () => 1.55 + Math.random() * 0.65),
        ...Array.from({ length: 5 }, () => 2.20 + Math.random() * 1.00),
    ];
    for (let i = stoneSizes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [stoneSizes[i], stoneSizes[j]] = [stoneSizes[j], stoneSizes[i]];
    }

    let placed = 0;
    for (const h of stoneSizes) {
        let x, z, tries = 0, ok = false;
        while (tries++ < 30) {
            x = (Math.random() - 0.5) * 76;
            z = (Math.random() - 0.5) * 76;
            if (Math.abs(x) < 3.5 && Math.abs(z) < 3.5) continue;
            let overlap = false;
            for (const c of colliders) {
                const dx = x - c.x;
                const dz = z - c.z;
                const r = c.radius + h * stoneAspect * 0.34 + 0.5;
                if (dx * dx + dz * dz < r * r) { overlap = true; break; }
            }
            if (!overlap) { ok = true; break; }
        }
        if (!ok) continue;

        const w = h * stoneAspect;   // 保持贴图比例，不拉伸
        const mat = new THREE.SpriteMaterial({
            map: stoneTex || null,
            color: stoneTex ? 0xffffff : 0x888888,
            transparent: true, depthTest: true, depthWrite: false,
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(w, h, 1);
        sprite.position.set(x, h / 2, z);
        sprite.userData = {
            type: 'stone',
            baseScale: new THREE.Vector2(w, h),
            spawnTime: performance.now() + placed * 25,
        };
        sprite.scale.set(0.001, 0.001, 1);
        scene.add(sprite);
        sceneObjects.push(sprite);
        colliders.push({ x, z, radius: w * 0.34, height: h });
        placed++;
    }

    /* 树 */
    const treeAspect = treeTex ? aspectOf(treeTex) : 0.7;
    for (let i = 0; i < 22; i++) {
        const x = (Math.random() - 0.5) * 82;
        const z = (Math.random() - 0.5) * 82;
        if (Math.abs(x) < 6 && Math.abs(z) < 6) { i--; continue; }
        let overlap = false;
        for (const c of colliders) {
            const dx = x - c.x;
            const dz = z - c.z;
            if (dx * dx + dz * dz < (c.radius + 1.2) * (c.radius + 1.2)) { overlap = true; break; }
        }
        if (overlap) { i--; continue; }

        const h = 4.2 + Math.random() * 2.6;
        const w = h * treeAspect;   // 保持比例
        const mat = new THREE.SpriteMaterial({
            map: treeTex || null,
            color: treeTex ? 0xffffff : 0x2f6b2f,
            transparent: true, depthTest: true, depthWrite: false,
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(w, h, 1);
        sprite.position.set(x, h / 2, z);
        sprite.userData = {
            type: 'tree',
            baseScale: new THREE.Vector2(w, h),
            spawnTime: performance.now() + 400 + Math.random() * 600,
        };
        sprite.scale.set(0.001, 0.001, 1);
        scene.add(sprite);
        sceneObjects.push(sprite);
        colliders.push({ x, z, radius: 0.55, height: h });
    }

    window.__kaiTex = kaiTex;
}

function initCamera() {
    camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.1, 300);
    camera.position.set(0, CONFIG.eyeHeight, 0);
    controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());
    controls.addEventListener('lock', () => { isLocked = true; });
    controls.addEventListener('unlock', () => { isLocked = false; });
}

function initRenderer() {
    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
}

/* ============================================================
   远程玩家模型

function createRemotePlayerMesh(texture) {
    const group = new THREE.Group();
    const aspect = aspectOf(texture) || 0.62;
    const mat = new THREE.SpriteMaterial({
        map: texture || null,
        color: texture ? 0xffffff : 0x6a6a6a,
        transparent: true, depthTest: true,
    });
    const sprite = new THREE.Sprite(mat);
    const h = 1.85;
    sprite.scale.set(h * aspect, h, 1);   // 保持比例
    sprite.position.y = h / 2;
    group.add(sprite);
    return group;
}

function createNameSprite(name) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 512;
    canvas.height = 80;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = 'bold 34px "Microsoft YaHei", "微软雅黑", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 7;
    ctx.lineJoin = 'round';
    ctx.strokeText(name, canvas.width / 2, canvas.height / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(name, canvas.width / 2, canvas.height / 2);
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    const mat = new THREE.SpriteMaterial({
        map: tex, transparent: true, depthTest: false, depthWrite: false,
    });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(2.6, 0.41, 1);
    sprite.renderOrder = 999;
    return sprite;
}

/* ============================================================
   移动端控制
   ============================================================ */
function initMobileControls() {
    const joyZone = document.getElementById('joystickZone');
    const joyKnob = document.getElementById('joystickKnob');
    const lookZone = document.getElementById('lookZone');
    const shootBtn = document.getElementById('shootBtn');
    const sprintBtn = document.getElementById('sprintBtn');
    const mobileRing = document.getElementById('mobileRing');

    /* 初始化光圈大小 */
    mobileRing.style.width = ringSize + 'px';
    mobileRing.style.height = ringSize + 'px';

    function updateSprintState() {
        sprinting = sprintByJoystick || sprintByButton;
        sprintBtn.classList.toggle('active', sprinting);
    }

    function isOnSprintZone(clientX, clientY) {
        const rect = sprintBtn.getBoundingClientRect();
        const pad = 26;
        return clientX >= rect.left - pad &&
               clientX <= rect.right + pad &&
               clientY >= rect.top - pad &&
               clientY <= rect.bottom + pad;
    }

    function bindDrag(el, onStart, onMove, onEnd) {
        let touchId = null;
        el.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (touchId !== null) return;
            const t = e.changedTouches[0];
            touchId = t.identifier;
            onStart && onStart(t.clientX, t.clientY);
        }, { passive: false });

        el.addEventListener('touchmove', (e) => {
            e.preventDefault(); e.stopPropagation();
            for (const t of e.changedTouches) {
                if (t.identifier === touchId) onMove && onMove(t.clientX, t.clientY);
            }
        }, { passive: false });

        el.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === touchId) {
                    touchId = null;
                    onEnd && onEnd();
                }
            }
        }, { passive: false });

        el.addEventListener('touchcancel', () => {
            touchId = null;
            onEnd && onEnd();
        }, { passive: false });

        let mouseDown = false;
        el.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            e.preventDefault(); e.stopPropagation();
            mouseDown = true;
            onStart && onStart(e.clientX, e.clientY);
        });
        const onDocMove = (e) => { if (mouseDown) onMove && onMove(e.clientX, e.clientY); };
        const onDocUp = () => {
            if (!mouseDown) return;
            mouseDown = false;
            onEnd && onEnd();
        };
        document.addEventListener('mousemove', onDocMove);
        document.addEventListener('mouseup', onDocUp);
    }

    function updateJoystick(clientX, clientY) {
        const rect = joyZone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const maxD = rect.width / 2 - 20;
        const d = Math.hypot(dx, dy);
        if (d > maxD) { dx = (dx / d) * maxD; dy = (dy / d) * maxD; }
        joyKnob.style.left = `calc(50% + ${dx}px)`;
        joyKnob.style.top  = `calc(50% + ${dy}px)`;
        joystickVec.set(dx / maxD, -dy / maxD);

        const inSprintZone = isOnSprintZone(clientX, clientY);
        if (inSprintZone !== sprintByJoystick) {
            sprintByJoystick = inSprintZone;
            updateSprintState();
        }
    }
    function resetJoystick() {
        joystickVec.set(0, 0);
        joyKnob.style.left = '50%';
        joyKnob.style.top = '50%';
        if (sprintByJoystick) {
            sprintByJoystick = false;
            updateSprintState();
        }
    }
    bindDrag(joyZone, updateJoystick, updateJoystick, resetJoystick);

    let lastLookX = 0, lastLookY = 0;
    bindDrag(lookZone,
        (x, y) => { lastLookX = x; lastLookY = y; showRing(x, y); },
        (x, y) => {
            const dx = x - lastLookX;
            const dy = y - lastLookY;
            lastLookX = x; lastLookY = y;
            const sens = sensitivity * 1.6;
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= dx * sens;
            euler.x -= dy * sens;
            euler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, euler.x));
            camera.quaternion.setFromEuler(euler);
            moveRing(x, y);
        },
        () => hideRing()
    );

    function shootStart(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        shoot();
        shootBtn.classList.add('hitting');
    }
    function shootEnd() { shootBtn.classList.remove('hitting'); }
    shootBtn.addEventListener('touchstart', shootStart, { passive: false });
    shootBtn.addEventListener('touchend', shootEnd, { passive: false });
    shootBtn.addEventListener('touchcancel', shootEnd, { passive: false });
    shootBtn.addEventListener('mousedown', shootStart);
    document.addEventListener('mouseup', shootEnd);

    function sprintBtnStart(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        sprintByButton = true;
        updateSprintState();
    }
    function sprintBtnEnd(e) {
        if (e && e.preventDefault) e.preventDefault();
        sprintByButton = false;
        updateSprintState();
    }
    sprintBtn.addEventListener('touchstart', sprintBtnStart, { passive: false });
    sprintBtn.addEventListener('touchend', sprintBtnEnd, { passive: false });
    sprintBtn.addEventListener('touchcancel', sprintBtnEnd, { passive: false });
    sprintBtn.addEventListener('mousedown', sprintBtnStart);
    document.addEventListener('mouseup', sprintBtnEnd);

    function showRing(x, y) {
        mobileRing.style.left = x + 'px';
        mobileRing.style.top = y + 'px';
        mobileRing.style.display = 'block';
    }
    function moveRing(x, y) {
        mobileRing.style.left = x + 'px';
        mobileRing.style.top = y + 'px';
    }
    function hideRing() { mobileRing.style.display = 'none'; }
}

/* ============================================================
   模式切换
   ============================================================ */
function setMobileMode(on, save = true) {
    mobileMode = on;
    document.body.classList.toggle('mobile', on);
    document.getElementById('mobileControls').classList.toggle('active', on);
    document.getElementById('crosshair').classList.toggle('hidden', on);
    document.getElementById('mobileRing').style.display = 'none';

    document.querySelectorAll('.toggle-btn[data-mode]').forEach(x => {
        x.classList.toggle('active', x.dataset.mode === (on ? 'mobile' : 'desktop'));
    });

    if (on && controls && controls.isLocked) controls.unlock();
    if (!on && gameStarted && !settingsOpen) {
        setTimeout(() => {
            if (!mobileMode && !settingsOpen && gameStarted) controls.lock();
        }, 150);
    }

    if (save) localStorage.setItem(LS.mode, on ? 'mobile' : 'desktop');
}

/* ============================================================
   自由视角
   ============================================================ */
function setFreeCamMode(on, save = true) {
    freeCamMode = on;
    document.querySelectorAll('.toggle-btn[data-freecam]').forEach(x => {
        x.classList.toggle('active', x.dataset.freecam === (on ? 'on' : 'off'));
    });
    document.getElementById('freeCamHint').classList.toggle('active', on);
    document.getElementById('crosshair').style.display = on ? 'none' : 'block';

    if (on) {
        player.vy = 0;
        if (controls && !controls.isLocked) controls.lock();
    } else {
        /* 相机回到玩家身上 */
        camera.position.set(
            player.pos.x,
            player.pos.y + CONFIG.eyeHeight,
            player.pos.z
        );
    }
    if (save) localStorage.setItem('sg_freecam', on ? 'on' : 'off');
}

function updateFreeCam(delta) {
    const speed = 12;
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

    const move = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp'])    move.add(forward);
    if (keys['KeyS'] || keys['ArrowDown'])  move.sub(forward);
    if (keys['KeyA'] || keys['ArrowLeft'])  move.sub(right);
    if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
    if (keys['Space'])                      move.y += 1;
    if (keys['ShiftLeft'] || keys['ShiftRight']) move.y -= 1;

    if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(speed * delta);
        camera.position.add(move);
    }
}

/* ============================================================
   跳跃 / 物理
   ============================================================ */
function tryJump() {
    if (player.onGround) {
        player.vy = CONFIG.jumpSpeed;
        player.onGround = false;
    }
}

function updatePlayer(delta, now) {
    if (!gameStarted) return;

    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
    forward.normalize();
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

    const move = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp'])    move.add(forward);
    if (keys['KeyS'] || keys['ArrowDown'])  move.sub(forward);
    if (keys['KeyA'] || keys['ArrowLeft'])  move.sub(right);
    if (keys['KeyD'] || keys['ArrowRight']) move.add(right);

    if (mobileMode && joystickVec.length() > 0.08) {
        move.add(forward.clone().multiplyScalar(joystickVec.y));
        move.add(right.clone().multiplyScalar(joystickVec.x));
    }

    const wantSprint = keys['ShiftLeft'] || keys['ShiftRight'] || sprinting;
    const speed = CONFIG.moveSpeed * (wantSprint ? CONFIG.sprintMultiplier : 1);
    const isMoving = move.lengthSq() > 0;

    if (isMoving) {
        move.normalize().multiplyScalar(speed * delta);
        player.pos.x += move.x;
        player.pos.z += move.z;
    }

    const limit = CONFIG.floorSize / 2 - 0.6;
    player.pos.x = Math.max(-limit, Math.min(limit, player.pos.x));
    player.pos.z = Math.max(-limit, Math.min(limit, player.pos.z));

    resolveHorizontalCollisions();

    const prevVy = player.vy;
    player.vy += CONFIG.gravity * delta;
    player.pos.y += player.vy * delta;

    const groundY = getGroundHeight(player.pos.x, player.pos.z);
    if (player.pos.y <= groundY) {
        if (!player.onGround && prevVy < -6) {
            landImpact = Math.min(1, Math.abs(prevVy) / 14);
        }
        player.pos.y = groundY;
        player.vy = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }

    if (isMoving && player.onGround) {
        bobTime += delta * (wantSprint ? 14 : 9);
        bobAmount = THREE.MathUtils.lerp(bobAmount, 1, 0.12);
    } else {
        bobAmount = THREE.MathUtils.lerp(bobAmount, 0, 0.15);
    }
    const bobY = Math.sin(bobTime) * 0.045 * bobAmount;
    const bobX = Math.cos(bobTime * 0.5) * 0.025 * bobAmount;

    landImpact = THREE.MathUtils.lerp(landImpact, 0, 0.15);
    const dip = landImpact * 0.18;

    recoilKick = THREE.MathUtils.lerp(recoilKick, 0, 0.2);

    camera.position.set(
        player.pos.x + bobX,
        player.pos.y + CONFIG.eyeHeight + bobY - dip - recoilKick * 0.02,
        player.pos.z
    );

    /* FOV：疾跑时稍微拉宽 */
    const targetFov = (wantSprint && isMoving) ? baseFov * 1.09 : baseFov;
    if (Math.abs(camera.fov - targetFov) > 0.1) {
        camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, 0.1);
        camera.updateProjectionMatrix();
    }

    /* 血量恢复 */
    if (now - player.lastDamageTime > CONFIG.hpRegenDelay * 1000 && player.health < CONFIG.maxHealth) {
        player.health = Math.min(CONFIG.maxHealth, player.health + CONFIG.hpRegenPerSec * delta);
        updateHealthUI();
    }

    document.getElementById('posDisplay').textContent =
        `${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}`;
}

function resolveHorizontalCollisions() {
    const feet = player.pos.y;
    const head = feet + CONFIG.playerHeight;
    for (const c of colliders) {
        if (feet >= c.height - 0.08) continue;
        if (head <= 0) continue;
        const dx = player.pos.x - c.x;
        const dz = player.pos.z - c.z;
        const r = c.radius + CONFIG.playerRadius;
        const d2 = dx * dx + dz * dz;
        if (d2 < r * r) {
            const d = Math.sqrt(d2) || 0.0001;
            const push = r - d;
            player.pos.x += (dx / d) * push;
            player.pos.z += (dz / d) * push;
        }
    }
}

function getGroundHeight(x, z) {
    let h = 0;
    const r = CONFIG.playerRadius * 0.85;
    for (const c of colliders) {
        const dx = x - c.x;
        const dz = z - c.z;
        if (dx * dx + dz * dz < (c.radius + r) * (c.radius + r)) {
            if (h < c.height) h = c.height;
        }
    }
    return h;
}

/* ============================================================
   血量
   ============================================================ */
function updateHealthUI() {
    const pct = Math.max(0, player.health) / CONFIG.maxHealth;
    const fill = document.getElementById('hpFill');
    const text = document.getElementById('hpText');
    fill.style.width = (pct * 100) + '%';
    fill.classList.remove('mid', 'low');
    if (pct < 0.3) fill.classList.add('low');
    else if (pct < 0.65) fill.classList.add('mid');
    text.textContent = Math.round(Math.max(0, player.health));
}

function takeDamage(amount) {
    if (!gameStarted) return;
    player.health = Math.max(0, player.health - amount);
    player.lastDamageTime = performance.now();
    updateHealthUI();

    /* 红闪 */
    const flash = document.getElementById('damageFlash');
    flash.classList.add('flash');
    setTimeout(() => flash.classList.remove('flash'), 40);
    setTimeout(() => { flash.style.opacity = '0'; }, 60);

    if (player.health <= 0) {
        respawn();
    }
}

function respawn() {
    player.health = CONFIG.maxHealth;
    player.pos.set(
        (Math.random() - 0.5) * 10,
        0,
        (Math.random() - 0.5) * 10
    );
    player.vy = 0;
    camera.position.set(player.pos.x, CONFIG.eyeHeight, player.pos.z);
    updateHealthUI();
    addKillFeed('你被击倒了，已重生');
}

/* ============================================================
   射击
   ============================================================ */
function shoot() {
    if (!gameStarted) return;

    const ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = ray.intersectObjects(sceneObjects, false);

    const crossEl = document.getElementById('crosshair');
    if (crossEl) {
        crossEl.classList.add('recoil');
        setTimeout(() => crossEl.classList.remove('recoil'), 120);
    }

    recoilKick = 1;
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    euler.setFromQuaternion(camera.quaternion);
    euler.x = Math.min(Math.PI / 2, euler.x + 0.014);
    camera.quaternion.setFromEuler(euler);

    if (hits.length > 0) {
        const obj = hits[0].object;
        showHitMarker();

        if (obj.userData && obj.userData.type === 'remotePlayer') {
            publishMessage({
                type: 'hit',
                targetId: obj.userData.playerId,
                from: player.name,
                damage: 22,
            });
        }
        if (obj.userData && (obj.userData.type === 'stone' || obj.userData.type === 'tree')) {
            if (obj.userData.baseScale) {
                obj.userData.animStart = performance.now();
                obj.userData.animating = true;
            }
        }
        publishMessage({
            type: 'shoot', id: player.id,
            position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
            direction: { x: ray.ray.direction.x, y: ray.ray.direction.y, z: ray.ray.direction.z },
        });
    }
}

function showHitMarker() {
    const el = document.createElement('div');
    el.className = 'hit-marker';
    el.textContent = '✕';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 350);
}

/* 场景物体动画：仅入场 + 受击弹跳，无呼吸脉动 */
function animateSceneObjects(now) {
    for (const o of sceneObjects) {
        if (!o.userData) continue;
        const base = o.userData.baseScale;
        if (!base) continue;
        const type = o.userData.type;
        if (type !== 'stone' && type !== 'tree') continue;

        if (o.userData.spawnTime && now < o.userData.spawnTime + 500) {
            const t = Math.max(0, (now - o.userData.spawnTime) / 500);
            const eased = 1 - Math.pow(1 - t, 3);
            const over = 1 + Math.sin(t * Math.PI) * 0.15;
            const k = eased * over;
            o.scale.set(base.x * k, base.y * k, 1);
            continue;
        }

        if (o.userData.animating) {
            const t = (now - o.userData.animStart) / 280;
            if (t >= 1) {
                o.userData.animating = false;
                o.scale.set(base.x, base.y, 1);
                continue;
            }
            const k = 1 + Math.sin(t * Math.PI) * 0.22;
            o.scale.set(base.x * k, base.y * k, 1);
            continue;
        }

        /* 静态 —— 无呼吸动画 */
        if (o.scale.x !== base.x || o.scale.y !== base.y) {
            o.scale.set(base.x, base.y, 1);
        }
    }
}

/* ============================================================
   MQTT
   ============================================================ */
function initNetwork() {
    const statusEl = document.getElementById('netStatus');
    if (typeof mqtt === 'undefined') {
        statusEl.textContent = '⚠ MQTT 未加载';
        statusEl.style.color = '#ffaa00';
        return;
    }
    mqttTopic = CONFIG.topicPrefix + player.roomId;
    statusEl.textContent = '○ 正在连接...';
    statusEl.style.color = '#ffaa00';

    try {
        mqttClient = mqtt.connect(CONFIG.mqttBroker, {
            clientId: 'sg_' + player.id + '_' + Math.random().toString(16).slice(2, 8),
            clean: true, connectTimeout: 9000, reconnectPeriod: 3500, keepalive: 30,
        });
        mqttClient.on('connect', () => {
            statusEl.textContent = '● 已连接 · ' + player.roomId;
            statusEl.style.color = '#5aff5a';
            statusEl.classList.remove('pulse');
            void statusEl.offsetWidth;
            statusEl.classList.add('pulse');
            mqttClient.subscribe(mqttTopic, { qos: 0 });
            publishMessage({
                type: 'join', id: player.id, name: player.name,
                skin: player.skin,
                position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
            });
        });
        mqttClient.on('message', (topic, payload) => {
            if (topic !== mqttTopic) return;
            try {
                const data = JSON.parse(payload.toString());
                if (data.id === player.id) return;
                handleNetworkMessage(data);
            } catch (e) {}
        });
        mqttClient.on('reconnect', () => {
            statusEl.textContent = '○ 正在重连...';
            statusEl.style.color = '#ffaa00';
        });
        mqttClient.on('offline', () => {
            statusEl.textContent = '○ 离线';
            statusEl.style.color = '#ff5555';
        });
        mqttClient.on('error', () => {
            statusEl.textContent = '⚠ 连接错误';
            statusEl.style.color = '#ffaa00';
        });
    } catch (e) {
        statusEl.textContent = '○ 连接失败';
        statusEl.style.color = '#ff5555';
    }
}

function disconnectNetwork() {
    if (mqttClient) {
        try {
            publishMessage({ type: 'leave', id: player.id });
            mqttClient.end(true);
        } catch (e) {}
        mqttClient = null;
    }
}

function publishMessage(data) {
    if (!mqttClient || !mqttClient.connected) return;
    try {
        let str = JSON.stringify(data);
        if (str.length > 220000 && data.skin) {
            const small = Object.assign({}, data);
            delete small.skin;
            mqttClient.publish(mqttTopic, JSON.stringify(small), { qos: 0 });
            return;
        }
        mqttClient.publish(mqttTopic, str, { qos: 0 });
    } catch (e) {}
}

function handleNetworkMessage(data) {
    switch (data.type) {
        case 'join':
            addRemotePlayer(data);
            publishMessage({
                type: 'welcome', id: player.id, name: player.name,
                skin: player.skin,
                position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
            });
            break;
        case 'welcome':
            if (!remotePlayers[data.id]) addRemotePlayer(data);
            break;
        case 'leave':
            removeRemotePlayer(data.id);
            break;
        case 'move':
            updateRemotePlayer(data);
            break;
        case 'skin':
            updateRemotePlayerSkin(data.id, data.skin);
            break;
        case 'hit':
            if (data.targetId === player.id) {
                showHitMarker();
                takeDamage(data.damage || 20);
                addKillFeed(`${data.from || '未知'} 击中了你`);
            }
            break;
    }
}

async function addRemotePlayer(data) {
    if (!data.id || remotePlayers[data.id]) return;
    const texture = await getSkinTexture(data.skin);
    if (remotePlayers[data.id]) return;

    const group = createRemotePlayerMesh(texture);
    group.position.set(data.position?.x || 0, 0, data.position?.z || 0);
    group.userData = { playerId: data.id, type: 'remotePlayer' };

    const nameSprite = createNameSprite(data.name || 'Unknown');
    nameSprite.position.y = 2.25;
    nameSprite.material.opacity = 0;
    group.add(nameSprite);

    group.scale.set(0.01, 0.01, 0.01);
    scene.add(group);

    remotePlayers[data.id] = {
        mesh: group, nameSprite,
        skin: data.skin || null,
        targetPos: new THREE.Vector3(data.position?.x || 0, 0, data.position?.z || 0),
        currentPos: new THREE.Vector3(data.position?.x || 0, 0, data.position?.z || 0),
        targetRot: 0, currentRot: 0,
        spawnTime: performance.now(),
        lastUpdate: performance.now(),
    };
    sceneObjects.push(group.children[0]);
    group.children[0].userData = { type: 'remotePlayer', playerId: data.id };
    updatePlayerCount();
    addKillFeed(`${data.name || '玩家'} 加入了游戏`);
}

async function updateRemotePlayerSkin(id, skin) {
    const rp = remotePlayers[id];
    if (!rp || rp.skin === skin) return;
    rp.skin = skin;
    const texture = await getSkinTexture(skin);
    if (rp.mesh && rp.mesh.children[0]) {
        rp.mesh.children[0].material.map = texture;
        rp.mesh.children[0].material.needsUpdate = true;
    }
}

function removeRemotePlayer(id) {
    const rp = remotePlayers[id];
    if (!rp) return;
    const idx = sceneObjects.indexOf(rp.mesh.children[0]);
    if (idx >= 0) sceneObjects.splice(idx, 1);
    scene.remove(rp.mesh);
    const ns = rp.nameSprite;
    if (ns && ns.material) {
        if (ns.material.map) ns.material.map.dispose();
        ns.material.dispose();
    }
    delete remotePlayers[id];
    updatePlayerCount();
}

function removeAllRemotePlayers() {
    for (const id in remotePlayers) removeRemotePlayer(id);
}

function updateRemotePlayer(data) {
    let rp = remotePlayers[data.id];
    if (!rp && data.position) {
        addRemotePlayer(data);
        rp = remotePlayers[data.id];
    }
    if (!rp) return;
    if (data.position) rp.targetPos.set(data.position.x, 0, data.position.z);
    if (data.rotation) rp.targetRot = data.rotation.y || 0;
    rp.lastUpdate = performance.now();
}

function updatePlayerCount() {
    const el = document.getElementById('playerCountDisplay');
    el.textContent = 1 + Object.keys(remotePlayers).length;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 200);
}

function interpolateRemotePlayers(now) {
    for (const id in remotePlayers) {
        const rp = remotePlayers[id];
        if (now - rp.lastUpdate > CONFIG.remoteTimeout) { removeRemotePlayer(id); continue; }

        const spawnAge = now - rp.spawnTime;
        if (spawnAge < 450) {
            const t = spawnAge / 450;
            const eased = 1 - Math.pow(1 - t, 3);
            const over = 1 + Math.sin(t * Math.PI) * 0.25;
            const k = eased * over;
            rp.mesh.scale.set(k, k, k);
        } else if (rp.mesh.scale.x !== 1) {
            rp.mesh.scale.set(1, 1, 1);
        }

        if (rp.nameSprite.material.opacity < 1) {
            rp.nameSprite.material.opacity = Math.min(1, rp.nameSprite.material.opacity + 0.05);
        }

        rp.currentPos.lerp(rp.targetPos, 0.18);
        rp.mesh.position.x = rp.currentPos.x;
        rp.mesh.position.z = rp.currentPos.z;

        let diff = rp.targetRot - rp.currentRot;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        rp.currentRot += diff * 0.18;
        rp.mesh.rotation.y = rp.currentRot;
    }
}

function sendNetworkUpdate() {
    if (!mqttClient || !mqttClient.connected || !gameStarted) return;
    const now = performance.now();
    if (now - lastNetSend < CONFIG.netInterval) return;
    lastNetSend = now;
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    euler.setFromQuaternion(camera.quaternion);
    publishMessage({
        type: 'move', id: player.id,
        position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
        rotation: { y: euler.y },
        name: player.name,
    });
}

function broadcastSkin() {
    if (!mqttClient || !mqttClient.connected) return;
    publishMessage({ type: 'skin', id: player.id, skin: player.skin });
}

function addKillFeed(text) {
    const feed = document.getElementById('killFeed');
    const el = document.createElement('div');
    el.className = 'kill-entry';
    el.textContent = text;
    feed.appendChild(el);
    setTimeout(() => el.remove(), 3000);
    while (feed.children.length > 5) feed.removeChild(feed.firstChild);
}

/* ============================================================
   图片压缩
   ============================================================ */
function compressSkinImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const maxSize = 96;
            let w = img.width, h = img.height;
            if (w > maxSize || h > maxSize) {
                const scale = maxSize / Math.max(w, h);
                w = Math.max(1, Math.round(w * scale));
                h = Math.max(1, Math.round(h * scale));
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, 0, 0, w, h);
            let dataURL = canvas.toDataURL('image/png');
            if (dataURL.length > 60000) {
                dataURL = canvas.toDataURL('image/jpeg', 0.72);
            }
            callback(dataURL);
        };
        img.onerror = () => callback(null);
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

/* ============================================================
   房间历史
   ============================================================ */
function getRoomHistory() {
    try {
        const arr = JSON.parse(localStorage.getItem(LS.rooms) || '[]');
        return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
}

function pushRoomHistory(roomId) {
    if (!roomId) return;
    let list = getRoomHistory();
    list = list.filter(r => r !== roomId);
    list.unshift(roomId);
    if (list.length > 8) list = list.slice(0, 8);
    localStorage.setItem(LS.rooms, JSON.stringify(list));
}

function renderRoomHistory(container, onPick) {
    container.innerHTML = '';
    const list = getRoomHistory();
    for (const r of list) {
        const chip = document.createElement('div');
        chip.className = 'room-chip';
        chip.textContent = r;
        chip.title = r;
        chip.addEventListener('click', () => onPick(r));
        container.appendChild(chip);
    }
}

/* ============================================================
   设置面板
   ============================================================ */
function initSettings() {
    const btn = document.getElementById('settingsBtn');
    const panel = document.getElementById('settingsPanel');
    const backBtn = document.getElementById('backBtn');
    const nameInput = document.getElementById('settingsNameInput');
    const sensSlider = document.getElementById('sensSlider');
    const sensValue = document.getElementById('sensValue');
    const fovSlider = document.getElementById('fovSlider');
    const fovValue = document.getElementById('fovValue');
    const ringSlider = document.getElementById('ringSlider');
    const ringValue = document.getElementById('ringValue');
    const skinPreviewImg = document.getElementById('skinPreviewImg');
    const skinUploadBtn = document.getElementById('skinUploadBtn');
    const skinResetBtn = document.getElementById('skinResetBtn');
    const skinFile = document.getElementById('skinFile');
    const switchRoomBtn = document.getElementById('switchRoomBtn');

    /* 读取已保存的设置 */
    const savedName = localStorage.getItem(LS.name);
    if (savedName) player.name = savedName;
    nameInput.value = player.name;

    const savedSens = parseFloat(localStorage.getItem(LS.sens));
    if (savedSens && savedSens >= 1 && savedSens <= 20) {
        sensSlider.value = savedSens;
    }
    sensValue.textContent = parseFloat(sensSlider.value).toFixed(1);
    sensitivity = CONFIG.sensFactor * parseFloat(sensSlider.value);

    const savedFov = parseFloat(localStorage.getItem(LS.fov));
    if (savedFov && savedFov >= 50 && savedFov <= 110) {
        fovSlider.value = savedFov;
        fov = savedFov;
        baseFov = savedFov;
    }
    fovValue.textContent = fov + '°';
    if (camera) {
        camera.fov = fov;
        camera.updateProjectionMatrix();
    }

    const savedRing = parseFloat(localStorage.getItem(LS.ring));
    if (savedRing && savedRing >= 60 && savedRing <= 320) {
        ringSlider.value = savedRing;
        ringSize = savedRing;
    }
    ringValue.textContent = ringSize;
    const mobileRing = document.getElementById('mobileRing');
    mobileRing.style.width = ringSize + 'px';
    mobileRing.style.height = ringSize + 'px';

    const savedSkin = localStorage.getItem(LS.skin);
    if (savedSkin) {
        player.skin = savedSkin;
        skinPreviewImg.src = savedSkin;
    } else {
        skinPreviewImg.src = ASSETS.kai;
    }

    /* 打开设置 */
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (controls && controls.isLocked) controls.unlock();
        settingsOpen = true;
        panel.classList.add('active');
        nameInput.value = player.name;
    });

    /* 返回（保存） */
    backBtn.addEventListener('click', () => {
        const newName = (nameInput.value.trim() || 'Steve').slice(0, 16);
        player.name = newName;
        localStorage.setItem(LS.name, newName);

        settingsOpen = false;
        panel.classList.remove('active');

        publishMessage({
            type: 'move', id: player.id, name: player.name,
            position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
            rotation: { y: 0 },
        });
        broadcastSkin();

        if (!mobileMode && !freeCamMode && gameStarted) {
            setTimeout(() => {
                if (!settingsOpen && !mobileMode && !freeCamMode) controls.lock();
            }, 150);
        }
    });

    /* 名字 */
    nameInput.addEventListener('input', () => {
        const v = (nameInput.value.trim() || 'Steve').slice(0, 16);
        player.name = v;
        localStorage.setItem(LS.name, v);
    });

    /* 摄像机灵敏度 */
    sensSlider.addEventListener('input', () => {
        const v = parseFloat(sensSlider.value);
        sensitivity = CONFIG.sensFactor * v;
        sensValue.textContent = v.toFixed(1);
        localStorage.setItem(LS.sens, sensSlider.value);
    });

    /* FOV */
    fovSlider.addEventListener('input', () => {
        const v = parseFloat(fovSlider.value);
        fov = v;
        baseFov = v;
        fovValue.textContent = v + '°';
        if (camera && !freeCamMode) {
            camera.fov = v;
            camera.updateProjectionMatrix();
        }
        localStorage.setItem(LS.fov, fovSlider.value);
    });

    /* 光圈大小 */
    ringSlider.addEventListener('input', () => {
        const v = parseFloat(ringSlider.value);
        ringSize = v;
        ringValue.textContent = v;
        mobileRing.style.width = v + 'px';
        mobileRing.style.height = v + 'px';
        localStorage.setItem(LS.ring, ringSlider.value);
    });

    /* 操作方式 */
    document.querySelectorAll('.toggle-btn[data-mode]').forEach(b => {
        b.addEventListener('click', () => setMobileMode(b.dataset.mode === 'mobile', true));
    });

    /* 自由视角 */
    document.querySelectorAll('.toggle-btn[data-freecam]').forEach(b => {
        b.addEventListener('click', () => setFreeCamMode(b.dataset.freecam === 'on', true));
    });

    /* 皮肤：上传 */
    skinUploadBtn.addEventListener('click', () => skinFile.click());
    skinFile.addEventListener('change', () => {
        const file = skinFile.files && skinFile.files[0];
        if (!file) return;
        compressSkinImage(file, (dataURL) => {
            if (!dataURL) { addKillFeed('皮肤图片无法读取'); return; }
            player.skin = dataURL;
            localStorage.setItem(LS.skin, dataURL);
            skinPreviewImg.src = dataURL;
            broadcastSkin();
            addKillFeed('皮肤已更新');
        });
        skinFile.value = '';
    });

    /* 皮肤：默认 */
    skinResetBtn.addEventListener('click', () => {
        player.skin = null;
        localStorage.removeItem(LS.skin);
        skinPreviewImg.src = ASSETS.kai;
        broadcastSkin();
        addKillFeed('已恢复默认皮肤');
    });

    /* 切换房间 */
    switchRoomBtn.addEventListener('click', () => {
        openRoomModal();
    });

    panel.addEventListener('click', (e) => e.stopPropagation());
}

/* ============================================================
   房间切换弹窗

function openRoomModal() {

function initRoomModal() {
    const modal = document.getElementById('roomModal');
    const input = document.getElementById('roomModalInput');
    const cancelBtn = document.getElementById('roomModalCancel');
    const confirmBtn = document.getElementById('roomModalConfirm');

    cancelBtn.addEventListener('click', () => {
        modal.classList.remove('active');
    });

    confirmBtn.addEventListener('click', () => {
        const newRoom = (input.value.trim() || 'public-room-1').slice(0, 32);
        modal.classList.remove('active');
        switchRoom(newRoom);
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmBtn.click();
    });
}

function switchRoom(newRoom) {
    if (newRoom === player.roomId) {
        addKillFeed('已在当前房间');
        return;
    }
    /* 清理旧房间 */
    disconnectNetwork();
    removeAllRemotePlayers();
    updatePlayerCount();

    player.roomId = newRoom;
    document.getElementById('roomDisplay').textContent = newRoom;
    localStorage.setItem(LS.room, newRoom);
    pushRoomHistory(newRoom);
    renderRoomHistory(document.getElementById('startRoomHistory'), (r) => {
        document.getElementById('roomInput').value = r;
    });

    /* 重置玩家位置 */
    player.pos.set(0, 0, 0);
    player.vy = 0;
    camera.position.set(0, CONFIG.eyeHeight, 0);

    addKillFeed(`已切换到房间: ${newRoom}`);
    initNetwork();
}

/* ============================================================
   主循环
   ============================================================ */
function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.08);
    const now = performance.now();

    if (gameStarted) {
        if (freeCamMode) {
            updateFreeCam(delta);
        } else {
            updatePlayer(delta, now);
        }
        interpolateRemotePlayers(now);
        animateSceneObjects(now);
        sendNetworkUpdate();
    }
    renderer.render(scene, camera);
}

/* ============================================================
   开始游戏
   ============================================================ */
function startGame() {
    const roomInput = document.getElementById('roomInput');
    player.roomId = (roomInput.value.trim() || 'public-room-1').slice(0, 32);
    player.id = 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    document.getElementById('roomDisplay').textContent = player.roomId;
    localStorage.setItem(LS.room, player.roomId);
    pushRoomHistory(player.roomId);

    const startScreen = document.getElementById('startScreen');
    startScreen.classList.add('hidden');
    setTimeout(() => { startScreen.style.display = 'none'; }, 600);

    gameStarted = true;
    player.health = CONFIG.maxHealth;
    updateHealthUI();

    if (!mobileMode && !freeCamMode) {
        setTimeout(() => {
            if (!mobileMode && !settingsOpen && !freeCamMode) controls.lock();
        }, 150);
    }
    initNetwork();
}

addEventListener('beforeunload', () => {
    if (mqttClient && mqttClient.connected) {
        publishMessage({ type: 'leave', id: player.id });
        mqttClient.end(true);
    }
});

/* ============================================================
   主入口
   ============================================================ */
async function main() {
    /* 恢复房间号 */
    const savedRoom = localStorage.getItem(LS.room);
    if (savedRoom) document.getElementById('roomInput').value = savedRoom;

    await buildWorld();
    initCamera();
    initRenderer();
    initSettings();
    initMobileControls();
    initRoomModal();

    /* 开始界面：房间历史 */
    renderRoomHistory(document.getElementById('startRoomHistory'), (r) => {
        document.getElementById('roomInput').value = r;
    });

    /* 触屏设备检测 + 恢复模式 */
    const isTouchDevice =
        /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
        ('ontouchstart' in window && navigator.maxTouchPoints > 0);

    const savedMode = localStorage.getItem(LS.mode);
    if (savedMode === 'mobile') setMobileMode(true, false);
    else if (savedMode === 'desktop') setMobileMode(false, false);
    else if (isTouchDevice) setMobileMode(true, false);

    /* 恢复自由视角 */
    const savedFreeCam = localStorage.getItem('sg_freecam');
    if (savedFreeCam === 'on') setFreeCamMode(true, false);

    document.getElementById('startBtn').addEventListener('click', startGame);
    animate();
}

main();
</script>
